<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101418"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Office Athlete</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f7fa;background:#101418}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{padding:24px 18px 12px;max-width:680px;margin:auto}main{max-width:680px;margin:auto;padding:0 16px 105px}.kicker{color:#c8f65d;font-size:11px;letter-spacing:2px;font-weight:800}.logo{font-size:32px;font-weight:950;letter-spacing:-1.5px;margin:4px 0}.lime{color:#c8f65d}.muted{color:#9ba5b0;font-size:12px}.panel{background:#1b2229;border:1px solid #303b43;border-radius:18px;padding:16px;margin:13px 0}.hero{background:linear-gradient(120deg,#2d4225,#1b2229)}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0}.days button{background:#232d34;color:#b4bdc5;border:0;border-radius:12px;padding:12px 0;font-size:10px}.days button.active{background:#c8f65d;color:#101418}.days b{display:block;font-size:17px;margin-top:4px}.ring{width:88px;height:88px;min-width:88px;border-radius:50%;display:grid;place-items:center}.ring span{background:#202d22;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-size:23px;font-weight:800}.task{display:flex;align-items:center;gap:12px;border-bottom:1px solid #303940;padding:12px 0}.task:last-child{border-bottom:0}.task h3{margin:0 0 4px;font-size:14px}.task small{color:#aab4bf}.task .dose{color:#c8f65d;font-size:12px;font-weight:700;margin-bottom:4px}.check{border:1.5px solid #596772;border-radius:9px;background:transparent;color:#111;width:30px;height:30px;min-width:30px;font-size:19px}.check.on{background:#c8f65d;border-color:#c8f65d}.done h3{text-decoration:line-through;color:#91a091}.symbol{width:44px;height:44px;min-width:44px;border-radius:12px;background:#2d383d;display:grid;place-items:center;font-size:23px}.bar{height:8px;background:#344049;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#c8f65d}.tabs{position:fixed;bottom:0;left:0;right:0;background:#151c21;border-top:1px solid #344049;display:flex;justify-content:center;padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;max-width:170px;background:none;border:0;color:#aab4bf;padding:10px 2px;border-radius:10px;font-size:11px}.tabs button.active{background:#293821;color:#c8f65d}.tabs span{display:block;font-size:21px}.pill{border:0;border-radius:9px;padding:10px 14px;background:#2c373f;color:#fff}.primary{background:#c8f65d;color:#101418;border:0;border-radius:11px;padding:14px;font-weight:800;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;background:#222d33;border-radius:13px}.big{font-size:32px;font-weight:850}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat div{aspect-ratio:1;display:grid;place-items:center;border-radius:5px;font-size:10px}input{width:100%;background:#10181d;border:1px solid #45515a;color:white;padding:12px;border-radius:10px;margin:5px 0 12px}h2{font-size:19px;margin:23px 0 10px}.timer{font-size:58px;text-align:center;font-variant-numeric:tabular-nums;font-weight:850;margin:22px 0}.note{line-height:1.6;font-size:12px;color:#b3bdc6}#notice{font-size:12px;color:#c8f65d;min-height:18px;text-align:center}
</style></head><body><header><div class="kicker">84 DAY TRAINING CHALLENGE</div><div class="logo">OFFICE <span class="lime">ATHLETE.</span></div><div class="muted">BUILD MUSCLE · MOVE FASTER · GET STRONGER</div></header><main id="app"></main><nav class="tabs" id="tabs"></nav><script>
const W=[['March in place','60 sec','🚶'],['Arm circles','30 sec','🔄'],['Shoulder rolls','30 sec','💪'],['Torso rotations','30 sec','↔️'],['Leg swings','30 sec each','🦵'],['Bodyweight squats','10 reps','🏋️']];
const S=[['Chest stretch','30 sec','🧘'],['Shoulder stretch','30 sec each','💪'],['Child’s pose','30 sec','🧘'],['Butterfly stretch','30 sec','🦋'],['Hamstring stretch','30 sec each','🦵'],['Hip flexor stretch','30 sec each','🦵']];
const H=[['Protein goal','120 g (adjust as needed)','🥚'],['Water goal','2 L (adjust as needed)','💧'],['Steps goal','7,000 steps','👟'],['Sleep goal','7–9 hours','🌙']];
const P=[
['Chest & shoulders','Push strength',[['Floor chest press','12 reps','🏋️'],['Push-ups','10 reps','💪'],['Shoulder press','10 reps','🏋️'],['Lateral raises','12 reps','💪'],['Tricep kickbacks','12 reps','🏋️'],['Shadowboxing','3 × 60 sec','🥊']]],
['Back & biceps','Pull and react',[['Dumbbell rows','12 reps','🏋️'],['Reverse fly','12 reps','💪'],['Band pulldowns','12 reps','〰️'],['Bicep curls','12 reps','🏋️'],['Hammer curls','10 reps','💪'],['Reflex ball','5 min','🥊']]],
['Legs & speed','Agility and core',[['Goblet squats','15 reps','🏋️'],['Reverse lunges','10 each leg','🦵'],['Plank','3 × 30 sec','💪'],['Reverse crunches','15 reps','🧘'],['Fast feet','5 × 20 sec','👟'],['Side-to-side hops','3 × 30 sec','⚡']]],
['Chest & punching','Explosive push',[['Floor chest press','12 reps','🏋️'],['Band chest fly','12 reps','〰️'],['Fast push-ups','6 reps','💪'],['Lateral raises','15 reps','💪'],['Speed shadowboxing','5 × 30 sec','🥊'],['Boxing footwork','3 × 60 sec','👟']]],
['Back & arms','Pull and agility',[['Single-arm rows','12 each arm','🏋️'],['Band face pulls','15 reps','〰️'],['Concentration curls','12 each arm','💪'],['Tricep pushdowns','12 reps','〰️'],['Reflex ball','5 min','🥊'],['Quick footwork','3 × 60 sec','👟']]],
['Active recovery','Mobility',[['Easy walk','20–30 min','🚶']]],['Rest','Recovery',[['Rest from weights','Today','🌙']]]];
let state={week:1,day:Math.min(new Date().getDay()+6===7?6:(new Date().getDay()+6)%7,6),tab:'today',logs:{},measure:{},equipment:{}};
try{state={...state,...JSON.parse(localStorage.getItem('officeAthleteV2')||'{}')}}catch{}
const save=()=>{try{localStorage.setItem('officeAthleteV2',JSON.stringify(state))}catch{}};
const sections=d=>d<5?[['Warm-up',W,'w'],['Workout',P[d][2],'t'],['Flexibility',S,'s'],['Daily targets',H,'h']]:[['Recovery',P[d][2],'t'],['Flexibility',S,'s'],['Daily targets',H,'h']];
const id=(w,d)=>w+'_'+d;const log=(w,d)=>state.logs[id(w,d)]||{};const counts=(w,d)=>{let l=log(w,d),all=sections(d).flatMap(([_,items,p])=>items.map((_,i)=>p+i));return [all.filter(k=>l[k]).length,all.length]};const score=(w,d)=>{let [a,b]=counts(w,d);return Math.round(a/b*100)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function task(item,p,i){let done=!!log(state.week,state.day)[p+i],strength=p==='t'&&(/reps|each arm|each leg/.test(item[1]));let dose=strength&&state.day<5?(state.week<=2?'2':'3')+' sets × '+item[1]:item[1];return `<div class="task ${done?'done':''}"><div class="symbol">${item[2]}</div><div style="flex:1"><h3>${esc(item[0])}</h3><div class="dose">${esc(dose)}</div></div><button class="check ${done?'on':''}" data-check="${p+i}" aria-label="Mark ${esc(item[0])} complete" aria-pressed="${done}">${done?'✓':''}</button></div>`}
function today(){let d=state.day,w=state.week,s=score(w,d),[a,b]=counts(w,d);return `<div class="flex"><button class="pill" data-week="-1">‹</button><div style="text-align:center"><b>WEEK ${w} / 12</b><div class="muted">${w<=2?'Foundation':w<=4?'Build':w<=8?'Progressive overload':'Performance'}</div></div><button class="pill" data-week="1">›</button></div><div class="days">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map((n,i)=>`<button class="${d===i?'active':''}" data-day="${i}">${n}<b>${score(w,i)===100?'✓':i+1}</b></button>`).join('')}</div><div class="panel hero"><div class="flex"><div><div class="kicker">DAY ${(w-1)*7+d+1}</div><h2 style="margin:8px 0">${P[d][0]}</h2><div class="muted">${P[d][1]}</div></div><div class="ring" style="background:conic-gradient(#c8f65d ${s}%,#465447 0)"><span>${s}%</span></div></div><div class="flex" style="margin-top:18px"><span>${a}/${b} completed</span><span class="muted">${d<5?'35–50 minutes':'Recovery'}</span></div></div>${sections(d).map(([title,items,p])=>`<h2>${title} <small class="muted">${items.filter((_,i)=>log(w,d)[p+i]).length}/${items.length}</small></h2><div class="panel" style="padding:4px 12px">${items.map((it,i)=>task(it,p,i)).join('')}</div>`).join('')}<p class="note">Start with light resistance. Stop if you feel pain, especially in your shoulder or neck. A stable bench is safer than a rolling chair.</p>`}
function scorePage(){let w=state.week,vals=Array.from({length:7},(_,i)=>score(w,i)),avg=Math.round(vals.reduce((a,b)=>a+b,0)/7),perfect=Object.keys(state.logs).filter(k=>{let [wk,d]=k.split('_').map(Number);return score(wk,d)===100}).length;return `<div class="panel"><div class="kicker">WEEKLY SCORECARD</div><div class="big lime">${avg}%</div><p class="muted">Average completion this week</p>${vals.map((v,i)=>`<div class="flex" style="margin:13px 0"><span style="width:36px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span><div class="bar" style="flex:1"><div style="width:${v}%"></div></div><b style="width:42px;text-align:right">${v}%</b></div>`).join('')}</div><div class="grid"><div class="stat"><div class="muted">Perfect days</div><div class="big">${perfect}</div><div class="muted">out of 84</div></div><div class="stat"><div class="muted">Challenge score</div><div class="big">${Math.round(Array.from({length:84},(_,i)=>score(Math.floor(i/7)+1,i%7)).reduce((a,b)=>a+b,0)/84)}%</div></div></div><div class="panel"><h2 style="margin-top:0">84-day challenge map</h2><div class="heat">${Array.from({length:84},(_,i)=>{let v=score(Math.floor(i/7)+1,i%7);return `<div style="background:${v===100?'#c8f65d':v>0?'#506c3b':'#303b43'};color:${v===100?'#101418':'#b4c0c9'}">${i+1}</div>`}).join('')}</div><p class="note">Lime: complete · Green: partially complete · Grey: not logged</p></div><div class="panel"><h2 style="margin-top:0">Weekly measurements</h2>${[['weight','Weight (kg)'],['waist','Waist (cm)'],['chest','Chest (cm)'],['arm','Upper arm (cm)'],['pushups','Max clean push-ups']].map(([k,l])=>`<label class="muted">${l}<input type="number" min="0" step="0.1" data-measure="${k}" value="${esc(state.measure[w]?.[k])}" placeholder="Enter measurement"></label>`).join('')}<div id="notice"></div><button class="primary" data-save="1">Save measurements</button></div>`}
let remaining=60,running=false,interval=null;
function timerPage(){return `<div class="panel"><div class="kicker">INTERVAL TIMER</div><div class="timer lime" id="clock">${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</div><div class="flex">${[20,30,60,90,300].map(t=>`<button class="pill" data-time="${t}">${t===300?'5m':t+'s'}</button>`).join('')}</div><button class="primary" style="margin-top:20px" data-run="1">${running?'Pause':'Start'}</button><button class="pill" style="width:100%;margin-top:10px" data-reset="1">Reset</button></div><div class="panel"><h2>Suggested intervals</h2><p>Strength rest: 60–90 seconds</p><p>Speed punches: 30 seconds</p><p>Shadowboxing: 60 seconds</p><p>Fast feet: 20 seconds</p><p>Reflex ball: 5 minutes</p></div>`}
function planPage(){return `<div class="panel"><h2 style="margin-top:0">12-week progression</h2>${[['Weeks 1–2','Foundation','2 sets. Learn technique.'],['Weeks 3–4','Build','3 sets with good form.'],['Weeks 5–8','Strength','Gradually increase resistance.'],['Weeks 9–12','Performance','Maintain form, improve speed.']].map(x=>`<div class="task"><div class="lime"><b>${x[0]}</b></div><div><h3>${x[1]}</h3><small>${x[2]}</small></div></div>`).join('')}</div><div class="panel"><h2 style="margin-top:0">Weekly split</h2>${P.map((x,i)=>`<div class="task"><div class="lime">${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</div><div><h3>${x[0]}</h3><small>${x[1]}</small></div></div>`).join('')}</div><div class="panel"><h2 style="margin-top:0">Equipment</h2>${['Adjustable dumbbells','Resistance bands','Exercise mat or gym tiles','Reflex ball','Stable bench or chair'].map((x,i)=>`<div class="task"><div style="flex:1">${x}</div><button class="check ${state.equipment[i]?'on':''}" data-equip="${i}">${state.equipment[i]?'✓':''}</button></div>`).join('')}</div><div class="panel"><h2 style="margin-top:0">Back up your progress</h2><p class="note">Your checkboxes and scores stay on this device. Export a backup to keep them safe or transfer to another phone.</p><button class="primary" data-export="1">Download progress backup</button><label class="muted" style="display:block;margin-top:16px">Restore a previous backup<input type="file" accept="application/json,.json" id="restore"></label></div><p class="note">Use proper shoes on tiled floors. No weighted shadowboxing. Core exercises alone do not specifically burn belly fat.</p>`}
function render(){document.getElementById('app').innerHTML=state.tab==='today'?today():state.tab==='score'?scorePage():state.tab==='timer'?timerPage():planPage();document.getElementById('tabs').innerHTML=[['today','◉','Today'],['score','▥','Scorecard'],['timer','◷','Timer'],['plan','▤','Plan']].map(([k,icon,label])=>`<button class="${state.tab===k?'active':''}" data-tab="${k}"><span>${icon}</span>${label}</button>`).join('')}
function tick(){remaining=Math.max(0,remaining-1);let el=document.getElementById('clock');if(el)el.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining===0){clearInterval(interval);running=false;render()}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset;if(a.tab){state.tab=a.tab}if(a.day!==undefined)state.day=+a.day;if(a.week)state.week=Math.min(12,Math.max(1,state.week+(+a.week)));if(a.check){let l=state.logs[id(state.week,state.day)]||{};l[a.check]=!l[a.check];state.logs[id(state.week,state.day)]=l}if(a.equip!==undefined)state.equipment[a.equip]=!state.equipment[a.equip];if(a.time){remaining=+a.time;running=false;clearInterval(interval)}if(a.reset){remaining=60;running=false;clearInterval(interval)}if(a.run){running=!running;clearInterval(interval);if(running)interval=setInterval(tick,1000)}if(a.save){state.measure[state.week]=state.measure[state.week]||{};document.querySelectorAll('[data-measure]').forEach(x=>state.measure[state.week][x.dataset.measure]=x.value)}if(a.export){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='office-athlete-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),500)}save();render()});
document.addEventListener('change',async e=>{if(e.target.dataset.measure){state.measure[state.week]=state.measure[state.week]||{};state.measure[state.week][e.target.dataset.measure]=e.target.value;save()}if(e.target.id==='restore'){try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.logs||!obj.measure)throw Error('Invalid backup');state={...state,...obj};save();render();alert('Progress restored!')}catch{alert('Unable to restore this backup file.')}}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
